# docker-compose.yml — Local dev / parity testing for code-server.
# Production deploys directly on the VM via autoconfig.sh (agents need full system access).
#
# Usage:
#   cp .env.example .env  &&  edit .env
#   docker compose up -d
#   open http://localhost:8080  (password from .env)

services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # bind to localhost; front with Nginx/Caddy in prod
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:?CODE_SERVER_PASSWORD must be set in .env}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - code-server-data:/home/coder/.local/share/code-server
      - code-server-config:/home/coder/.config/code-server
      - ./workspace:/home/coder/workspace
    # Read-only root fs would break code-server extensions; left writable.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  code-server-data:
  code-server-config:
